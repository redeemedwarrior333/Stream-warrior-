name: Build Phone Warrior APK

on:
  push:
    branches: ["**"]
    paths: ["phone-warrior/**", ".github/workflows/build-phone-warrior.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: phone-warrior
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneWarrior-debug-apk
          path: phone-warrior/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
