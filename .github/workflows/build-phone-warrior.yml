name: Build Phone Warrior APK

on:
  push:
    branches: ["**"]
    paths: ["phone-warrior/**", ".github/workflows/build-phone-warrior.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: phone-warrior
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneWarrior-debug-apk
          path: phone-warrior/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-crash-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: phone-warrior
        run: gradle assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Launch app on emulator, capture any crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb install -r phone-warrior/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            echo "===== LAUNCHING PHONE WARRIOR ====="
            adb shell am start -n com.phonewarrior.app/.MainActivity
            sleep 15
            echo "===== PROCESS STATUS ====="
            (adb shell pidof com.phonewarrior.app && echo "APP IS ALIVE") || echo "APP PROCESS GONE (likely crashed)"
            echo "===== CRASH LINES FROM LOGCAT ====="
            adb logcat -d *:E | grep -E "FATAL|AndroidRuntime|phonewarrior" | head -120 || echo "no errors in logcat"
