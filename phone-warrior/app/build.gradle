plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ksFile = file("../signing/pw-release.p12")

def dailyVersionCode() {
    return (int) (System.currentTimeMillis() / 86400000L)  // YYYY+ days-since-epoch: auto-bumps each day
}

android {
    namespace 'com.phonewarrior.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.phonewarrior.app"
        minSdk 24
        targetSdk 34
        versionCode dailyVersionCode()
        versionName "1.2"
    }

    signingConfigs {
        stable {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword "PWden2026!key"
                keyAlias "phonewarrior"
                keyPassword "PWden2026!key"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.stable
        }
        debug {
            // ONE stable key across all builds -> updates install over each other
            if (ksFile.exists()) signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
