<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Message Cards — Warrior Prophet</title>
<meta name="description" content="Spiritual message decks: God's Promises, Words of Jesus, and the premium Angel Watch deck. Draw one card or three.">
<meta name="theme-color" content="#0e0b1d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230e0b1d'/%3E%3Ctext x='50' y='70' font-size='50' text-anchor='middle'%3E%F0%9F%99%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css?v=1">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><a href="index.html">⚔️ WARRIOR PROPHET</a></div>
    <h1>Message Cards</h1>
    <div class="tag">Choose a deck. Draw with a quiet heart.</div>
    <div class="stars">· ˚ ✝ ˚ ·</div>
  </header>

  <div class="panel">
    <div class="decks" id="decks"></div>
    <div class="row">
      <button class="btn2" id="draw1">Draw 1 Card</button>
      <button class="btn2" id="draw3">Draw 3 Cards</button>
    </div>
  </div>

  <div class="cardrow" id="row">
    <div class="slot"><div class="pos" id="p0">—</div><div class="card" id="c0"><div class="inner"><div class="face back">✝️</div><div class="face front"></div></div></div></div>
    <div class="slot"><div class="pos" id="p1">—</div><div class="card" id="c1"><div class="inner"><div class="face back">✝️</div><div class="face front"></div></div></div></div>
    <div class="slot"><div class="pos" id="p2">—</div><div class="card" id="c2"><div class="inner"><div class="face back">✝️</div><div class="face front"></div></div></div></div>
  </div>

  <div class="msg" id="reading" hidden></div>

  <div class="row" id="actions" hidden>
    <button class="btn2" id="again">🔄 New Draw</button>
    <button class="btn2" id="sharebtn">📤 Share</button>
  </div>

  <footer>
    <div><a href="index.html">⚔️ Warrior Prophet</a> · part of the <a href="https://redeemedwarrior333.github.io/Stream-warrior-/">Warrior family</a></div>
    <div class="forfun">A devotional encouragement tool. Always test every word against Scripture — Acts 17:11.</div>
  </footer>
</div>

<script src="js/engine.js?v=1"></script>
<script src="js/decks.js?v=1"></script>
<script src="js/premium.js?v=1"></script>
<script>
"use strict";
var CARDS_PAGE = (function () {
  var $ = function (id) { return document.getElementById(id); };
  var POS3 = ["Where you've been", "Where you are", "Where you're going"];
  var currentDeck = "promises";
  var lastText = "";

  function renderDeckButtons() {
    var box = $("decks");
    box.innerHTML = "";
    DECKS.DECK_LIST.forEach(function (d) {
      var b = document.createElement("button");
      b.className = "deck" + (d.id === currentDeck ? " on" : "") + (!d.free && !MW_PREMIUM.isPremium() ? " locked" : "");
      b.id = "deck-" + d.id;
      b.textContent = d.sym + " " + d.name + (!d.free && !MW_PREMIUM.isPremium() ? " 👑" : "");
      b.addEventListener("click", function () { chooseDeck(d.id); });
      box.appendChild(b);
    });
  }

  function chooseDeck(id) {
    var d = DECKS.byId(id);
    if (!d.free && !MW_PREMIUM.isPremium()) {
      if (confirm("The Angel Watch deck is part of Warrior Prophet Premium. Open the Premium page?")) {
        location.href = "premium.html";
      }
      return;
    }
    currentDeck = id;
    renderDeckButtons();
  }

  function clearCards() {
    for (var i = 0; i < 3; i++) {
      $("c" + i).classList.remove("flip");
      $("c" + i).querySelector(".front").innerHTML = "";
      $("p" + i).textContent = "—";
    }
    $("reading").hidden = true;
    $("actions").hidden = true;
  }

  function showCard(slotIdx, card, posLabel) {
    $("p" + slotIdx).textContent = posLabel;
    $("c" + slotIdx).querySelector(".front").innerHTML =
      '<div class="sym">🕊️</div><div class="tx">' + card[0] + '</div><div class="rf">— ' + card[1] + '</div>';
    $("c" + slotIdx).classList.add("flip");
  }

  function draw(n) {
    clearCards();
    var deck = DECKS.byId(currentDeck);
    var cards = DECKS.cardsFor(currentDeck);
    var rng = WP.rngFor(WP.todayStr() + "|" + currentDeck + "|" + Date.now());
    var drawn = WP.shuffle(cards, rng).slice(0, n);
    var labels = n === 1 ? ["Your message"] : POS3;

    drawn.forEach(function (c, i) {
      setTimeout(function () { showCard(i, c, labels[i]); }, 350 + i * 500);
    });

    var intro = n === 1 ? deck.intro : deck.intro + " Three cards, one thread:";
    lastText = "🕯️ " + deck.name + " — Warrior Prophet\n\n" + drawn.map(function (c, i) {
      return labels[i] + ": " + c[0] + "\n— " + c[1];
    }).join("\n\n");

    setTimeout(function () {
      var box = $("reading");
      box.innerHTML = '<span class="line">' + intro + '</span>';
      drawn.forEach(function (c, i) {
        var s = document.createElement("span");
        s.className = "line";
        s.innerHTML = "<b style='color:var(--gold)'>" + labels[i] + ":</b> " + c[0] +
          '<span class="verse">"' + c[1] + '"</span>';
        box.appendChild(s);
      });
      box.hidden = false;
      $("actions").hidden = false;
      if (box.scrollIntoView) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 350 + n * 500);
  }

  function share() {
    if (!lastText) return;
    if (navigator.share) navigator.share({ title: "Warrior Prophet", text: lastText, url: location.href }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(lastText + "\n\n" + location.href).then(function () {
      $("sharebtn").textContent = "✅ Copied!";
      setTimeout(function () { $("sharebtn").textContent = "📤 Share"; }, 1600);
    });
  }

  return { draw: draw, share: share, renderDeckButtons: renderDeckButtons, chooseDeck: chooseDeck };
})();

(function () {
  var $ = function (id) { return document.getElementById(id); };
  CARDS_PAGE.renderDeckButtons();
  $("draw1").addEventListener("click", function () { CARDS_PAGE.draw(1); });
  $("draw3").addEventListener("click", function () { CARDS_PAGE.draw(3); });
  $("again").addEventListener("click", function () { location.reload(); });
  $("sharebtn").addEventListener("click", CARDS_PAGE.share);
})();
</script>
</body>
</html>
