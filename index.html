<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stream Warrior — Streamer Mod Menu</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<header id="topbar">
  <div class="brand"><img src="icon.svg" alt="" class="brand-logo"> Stream<span>Warrior</span></div>
  <div class="top-actions">
    <button id="ai-dot" class="ai-dot" title="AI status">AI</button>
    <button id="btn-help" class="icon-btn" title="How to use on stream">❓</button>
    <button id="btn-settings" class="icon-btn" title="Settings">⚙️</button>
  </div>
</header>

<main id="scene">
  <!-- Active module scene renders here -->
</main>

<nav id="modbar">
  <button id="btn-wheel" class="mod-btn wheel" data-module="wheel">🎡<span>Chaos</span></button>
  <!-- module buttons injected by app.js -->
  <button id="btn-hidebar" class="mod-btn hide" title="Hide bar">👁️<span>Hide</span></button>
</nav>

<div id="peek-zone"></div>

<!-- Settings modal -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-card">
    <h2>⚙️ Settings</h2>

    <section class="set-group">
      <h3>AI Connection <span class="optional">(optional)</span></h3>
      <p class="hint">Stream Warrior works fully offline with built-in content. Connect an AI to unlock <b>endless</b> generated content.</p>
      <label>API Base URL
        <input id="set-endpoint" type="url" placeholder="https://api.mistral.ai/v1">
      </label>
      <label>Model
        <input id="set-model" type="text" placeholder="mistral-small-latest">
      </label>
      <label>API Key
        <input id="set-key" type="password" placeholder="paste key (stored on this device only)">
      </label>
      <div class="row">
        <button id="btn-ai-test" class="btn small">Test</button>
        <span id="ai-test-result"></span>
      </div>
    </section>

    <section class="set-group">
      <h3>Soundboard</h3>
      <label>Add custom sound (mp3/ogg/wav, small files)
        <input id="set-sound-file" type="file" accept="audio/*">
      </label>
      <p class="hint">Custom sounds are saved on this device.</p>
      <div id="custom-sounds-list" class="custom-sounds"></div>
    </section>

    <section class="set-group">
      <h3>Streamer name</h3>
      <label>Shown on overlays
        <input id="set-name" type="text" placeholder="Your name">
      </label>
    </section>

    <div class="modal-actions">
      <button id="btn-settings-close" class="btn">Done</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/sound.js"></script>
<script src="js/tarot.js"></script>
<script src="js/games.js"></script>
<script src="js/laws.js"></script>
<script src="js/app.js"></script>
</body>
</html>
